name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: zeno
            archive_format: tar.gz
            asset_name: zeno-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: zeno
            archive_format: tar.gz
            asset_name: zeno-linux-aarch64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: zeno
            archive_format: tar.gz
            asset_name: zeno-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: zeno
            archive_format: tar.gz
            asset_name: zeno-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: zeno.exe
            archive_format: zip
            asset_name: zeno-windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --bin zeno --target ${{ matrix.target }}
          else
            cargo build --release --bin zeno --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package archive (Unix)
        if: matrix.archive_format == 'tar.gz'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/
          cp LICENSE staging/
          cp README.md staging/ 2>/dev/null || true
          cd staging
          tar -czf ../${{ matrix.asset_name }}.tar.gz *
          cd ..
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
        shell: bash

      - name: Package archive (Windows)
        if: matrix.archive_format == 'zip'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/
          cp LICENSE staging/
          cp README.md staging/ 2>/dev/null || true
          cd staging
          7z a ../${{ matrix.asset_name }}.zip *
          cd ..
          certutil -hashfile ${{ matrix.asset_name }}.zip SHA256 > ${{ matrix.asset_name }}.zip.sha256
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.*

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS file
        run: |
          cd release-assets
          sha256sum zeno-*.* > SHA256SUMS.txt || true
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
