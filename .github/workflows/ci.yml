name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update --no-self-update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # All three are first-class (spec §3), and the input path differs on
        # each: the tests that drive a real terminal are the reason this runs
        # everywhere rather than on Linux alone.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update --no-self-update stable && rustup default stable
      - name: Unit tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Terminal emulator for the end-to-end tests
        run: python -m pip install pyte
      - name: Pty for the end-to-end tests on Windows
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty
      - name: End-to-end tests in a real terminal
        run: python -m unittest discover -s tests/e2e -v
